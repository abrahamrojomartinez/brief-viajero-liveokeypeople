<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquí no hay nada · VIBRA × LiveOkey</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;600;700&display=swap">
<style>
/* Los mismos tokens de LiveOkey que el itinerario: tinta casi negra y
   el rojo de la marca. Una pagina que casi nadie vera, pero si la ve
   alguien que ha pegado mal un enlace, que no parezca roto el sitio. */
:root{
  --bg:#0A0908; --bg2:#1C1917; --tx:#F5F1EC; --tx2:#A8A09A;
  --ac:#BC2813; --ac-tx:#E04A2E; --ln:#332E2B;
  --f-d:'Fraunces',Georgia,'Times New Roman',serif;
  --f-u:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--f-u);font-size:16.5px;
  line-height:1.62;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center}
.centro{max-width:560px;margin:0 auto;padding-inline:22px;padding-block:60px}
.sello{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  color:var(--ac-tx)}
h1{font-family:var(--f-d);font-size:clamp(32px,8vw,52px);font-weight:600;
  letter-spacing:-.022em;line-height:1.08;margin-top:14px;text-wrap:balance}
h1 em{font-style:italic;font-weight:400;color:var(--ac-tx)}
p{color:var(--tx2);margin-top:16px;max-width:44ch}
.salidas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
a.btn{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;text-decoration:none;color:var(--bg);background:var(--tx);
  border:1px solid var(--tx);padding:14px 22px;transition:background .18s,color .18s,
  border-color .18s}
a.btn:hover{background:var(--ac);border-color:var(--ac);color:#fff}
a.btn.suave{background:transparent;color:var(--tx2);border-color:var(--ln)}
a.btn.suave:hover{background:transparent;color:var(--tx);border-color:var(--tx2)}
</style>
</head>
<body>
  <div class="centro">
    <span class="sello">Error 404</span>
    <h1>Aqu&iacute; no hay <em>nada</em></h1>
    <p>Esta direcci&oacute;n no existe. Lo m&aacute;s probable es que el enlace se haya
      partido al copiarlo &mdash;pasa mucho en WhatsApp&mdash;. Prueba con el
      itinerario del viaje.</p>
    <div class="salidas">
      <a class="btn" href="/itinerario/">Ver el itinerario</a>
      <a class="btn suave" href="/">Ir al principio</a>
    </div>
  </div>
</body>
</html>
